<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Sword & underline: Swordle + dantewins + the wavy-underline gesture; sword-in-the-stone, but the stone is the squiggle -->
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(0 -1)">
    <!-- blade, clean taper -->
    <path d="M22.8 17.5 L22.8 36.2 L24 40.3 L25.2 36.2 L25.2 17.5" stroke-width="1.9"/>
    <!-- crossguard, swept slightly up at the tips -->
    <path d="M17.8 16.6 C20.2 17.6 27.8 17.6 30.2 16.6" stroke-width="2.6"/>
    <!-- grip -->
    <path d="M24 17.5 L24 12" stroke-width="2.4"/>
    <!-- pommel -->
    <circle cx="24" cy="10.3" r="1.4" fill="currentColor" stroke="none"/>
    <!-- wavy underline, pierced by the blade -->
    <path d="M8.5 31.4 C11 28.9 13.5 33.5 16 31.2 C18 29.3 19.8 32 21.2 31.6" stroke-width="2.2"/>
    <path d="M26.8 31.4 C28.6 29.4 30.8 33.3 33.2 31.1 C35.4 29.2 37.6 33 39.5 31" stroke-width="2.2"/>
  </g>
</svg>
