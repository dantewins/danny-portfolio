<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Paper plane: hand-drawn with dotted loop trail, style A -->
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- top edge: nose to tail -->
    <path d="M40.6 9.6 C33.2 12.4 21.9 19.3 9.6 26.2" stroke-width="2.4"/>
    <!-- tail to fold point -->
    <path d="M9.6 26.2 C14.3 26.6 19 27.3 23.8 28.2" stroke-width="2.4"/>
    <!-- fold point to bottom tip -->
    <path d="M23.8 28.2 C24.9 31.7 26.2 35.2 27.6 38.8" stroke-width="2.4"/>
    <!-- bottom tip back to nose -->
    <path d="M27.6 38.8 C32.2 29.9 36 19.4 40.6 9.6" stroke-width="2.4"/>
    <!-- center crease -->
    <path d="M23.8 28.2 C28.6 22.4 34.3 15.9 40.6 9.6" stroke-width="2"/>
    <!-- dotted swoosh trail -->
    <path d="M7 39.5 C11.5 40.8 16.5 39.8 21 36.8" stroke-width="2" stroke-dasharray="0.1 5"/>
  </g>
</svg>
